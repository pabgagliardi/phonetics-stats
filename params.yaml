corpus:
  path: data/ru-fr_interference

acoustic:
  max_formant_female: 5000
  max_formant_male: 4500
  n_formants: 5

whisper:
  model: openai/whisper-medium
  layers:
    - 4
    - 20

xlsr:
  model: facebook/wav2vec2-large-xlsr-53
  layers:
    - 4
    - 10
    - 20

pca:
  n_components_visualisation: 2
  n_components_clustering: 50

distance:
  metric: cosine

clustering:
  min_tokens: 10
  french_vowels:
    - a
    - e
    - i
    - o
    - u
    - y
    - ø
    - ɑ
    - ə
    - ɛ
    - ɑ̃